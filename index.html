<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a1418" />
  <meta name="description" content="潮息 Tide Breath — 雾感海潮引导呼吸" />
  <title>潮息 Tide Breath</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sea" aria-hidden="true">
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>
    <canvas id="ripple" class="ripple" width="1" height="1"></canvas>
  </div>

  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>潮息</h1>
          <span class="brand-sub">Tide Breath</span>
        </div>
      </div>
      <div class="header-right">
        <span class="today-pill" id="todayPill" title="今日完成轮数">今日 0 轮</span>
        <button type="button" class="icon-btn" id="btnSound" aria-label="提示音关" title="提示音（默认关）" aria-pressed="false">
          <svg class="ico-sound-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5L6 9H3v6h3l5 4V5z"/>
            <path d="M23 9l-6 6M17 9l6 6"/>
          </svg>
          <svg class="ico-sound-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M11 5L6 9H3v6h3l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 010 7"/>
            <path d="M18.5 5.5a9 9 0 010 13"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="modes" role="tablist" aria-label="呼吸模式">
      <button type="button" class="mode-btn is-active" data-mode="calm" role="tab" aria-selected="true">
        <span class="mode-name">平静</span>
        <span class="mode-meta">4 · 4</span>
      </button>
      <button type="button" class="mode-btn" data-mode="box" role="tab" aria-selected="false">
        <span class="mode-name">方盒</span>
        <span class="mode-meta">4 · 4 · 4 · 4</span>
      </button>
      <button type="button" class="mode-btn" data-mode="sleep" role="tab" aria-selected="false">
        <span class="mode-name">安眠</span>
        <span class="mode-meta">4 · 7 · 8</span>
      </button>
    </nav>

    <section class="stage" aria-live="polite">
      <div class="tide-wrap" id="tideWrap">
        <div class="tide-halo" id="tideHalo"></div>
        <div class="tide-outer" aria-hidden="true"></div>
        <div class="tide-ring" id="tideRing">
          <div class="tide-core" id="tideCore"></div>
        </div>
        <div class="tide-readout">
          <div class="phase" id="phaseText">准备</div>
          <div class="countdown" id="countText">—</div>
        </div>
      </div>

      <p class="hint" id="hintText">选好模式，点开始，跟着潮汐呼吸</p>

      <div class="opts">
        <label class="opt">
          <span class="opt-label">轮数</span>
          <select id="cyclesSelect" aria-label="循环轮数">
            <option value="3">3 轮</option>
            <option value="4" selected>4 轮</option>
            <option value="6">6 轮</option>
            <option value="8">8 轮</option>
            <option value="0">不限</option>
          </select>
        </label>
        <div class="opt progress-opt">
          <span class="opt-label">进度</span>
          <span class="progress-text" id="progressText">未开始</span>
        </div>
      </div>

      <div class="controls">
        <button type="button" class="ctrl secondary" id="btnReset" aria-label="重置" title="重置 (R)">重置</button>
        <button type="button" class="ctrl primary" id="btnToggle" aria-label="开始" title="开始/暂停 (空格)">开始</button>
      </div>
    </section>

    <footer class="footer">
      <p>吸气放大 · 呼气缩小 · 深青雾感海潮</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
